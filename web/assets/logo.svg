<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Shield Outline -->
  <path d="M50 8 L85 24 C85 58 50 88 50 88 C50 88 15 58 15 24 Z" fill="url(#shieldGrad)" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Stylized Modern Bank Pillar & Digital S -->
  <path d="M35 34 H65 M50 34 V70 M35 70 H65" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Circuit Nodes -->
  <circle cx="50" cy="20" r="3.5" fill="#00e5ff"/>
  <circle cx="28" cy="52" r="3" fill="#3b82f6"/>
  <circle cx="72" cy="52" r="3" fill="#00e5ff"/>
</svg>
